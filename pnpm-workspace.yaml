packages:
  - frontend
  - backend
  - shared

allowBuilds:
  esbuild: true

# One version per dependency across the three workspaces.
catalog:
  "@eslint/js": ^10.0.0
  "@hono/node-server": ^2.1.3
  "@libsql/client": ^0.18.0
  "@types/node": ^24.0.0
  "@types/react": ^19.2.0
  "@types/react-dom": ^19.2.0
  drizzle-kit: ^0.31.11
  drizzle-orm: ^0.45.3
  eslint: ^10.11.0
  eslint-plugin-react-hooks: ^7.1.1
  hono: ^4.13.12
  next: ^16.3.8
  pdf-lib: ^1.17.1
  # Exact, not a range: citation highlighting matches quotes against pdf.js's extracted text, so a
  # text-layer change would move every highlight out from under a citation. Bump it, re-pin
  # PDFJS_VERSION in shared/src/pack.ts with it, and re-run the pack integrity test.
  pdfjs-dist: 6.3.289
  react: ^19.3.0
  react-dom: ^19.3.0
  tsx: ^4.23.15
  # typescript-eslint supports TypeScript <6.1; do not bump to 7 until it does.
  typescript: ~6.0.3
  typescript-eslint: ^8.71.0
  vitest: ^5.0.3
  zod: ^4.6.5
